name: prerelease

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.run_id }}"
  cancel-in-progress: true

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  preflight:
    name: Validate release ref
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      default_branch: ${{ steps.ref.outputs.default_branch }}
    steps:
      - name: Require the default branch
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          default_branch=$(gh api "repos/$REPOSITORY" --jq '.default_branch')
          if [[ "$EVENT_NAME" != workflow_dispatch || "$REF" != "refs/heads/$default_branch" ]]; then
            echo "Release dispatch rejected: expected workflow_dispatch on refs/heads/$default_branch, got $EVENT_NAME on $REF" >&2
            exit 1
          fi
          echo "default_branch=$default_branch" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.target }})
    needs: preflight
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            target: aarch64-apple-darwin
            goos: darwin
            goarch: arm64
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            goos: linux
            goarch: arm64
          - runner: ubuntu-latest
            target: android-arm64
            goos: android
            goarch: arm64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Compute fork version
        run: |
          app_version=$(grep 'version-name = ' android/gradle/libs.versions.toml | cut -d '"' -f 2)
          base=$(echo "$app_version" | cut -d. -f1-3)
          short=${GITHUB_SHA:0:12}
          echo "FORK_VERSION=v${base}-fork-${short}" >> "$GITHUB_ENV"
          echo "Fork version: v${base}-fork-${short}"
          if ! [[ "v${base}-fork-${short}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-fork-[0-9a-f]+$ ]]; then
            echo "Computed FORK_VERSION does not satisfy lib/build version regex" >&2
            exit 1
          fi
      - name: Generate GUI assets
        run: go generate ./lib/api/auto/
      - name: Build static release binary
        if: matrix.goos != 'android'
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -tags noupgrade -ldflags "-s -w -X github.com/syncthing/syncthing/lib/build.Version=$FORK_VERSION" -o "syncthing-${{ matrix.target }}" ./cmd/syncthing
      - name: Build static Android binary
        if: matrix.goos == 'android'
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -tags noupgrade -ldflags "-s -w -checklinkname=0 -X github.com/syncthing/syncthing/lib/build.Version=$FORK_VERSION" -o "syncthing-${{ matrix.target }}" ./cmd/syncthing
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: syncthing-${{ matrix.target }}
          path: syncthing-*

  release:
    name: Create pre-release
    needs: [preflight, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - name: Recheck release ref and tag
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ needs.preflight.outputs.default_branch }}
          RELEASE_TAG: release-${{ github.sha }}
        run: |
          default_branch=$(gh api "repos/$REPOSITORY" --jq '.default_branch')
          if [[ "$EVENT_NAME" != workflow_dispatch || "$REF" != "refs/heads/$default_branch" || "$DEFAULT_BRANCH" != "$default_branch" ]]; then
            echo "Release publication rejected: expected workflow_dispatch on refs/heads/$default_branch, got $EVENT_NAME on $REF" >&2
            exit 1
          fi
          if response=$(gh api "repos/$REPOSITORY/git/ref/tags/$RELEASE_TAG" 2>&1); then
            echo "Release publication rejected: tag $RELEASE_TAG already exists; inspect it before proceeding" >&2
            exit 1
          else
            if [[ "$response" != *"HTTP 404"* ]]; then
              printf 'Could not verify that tag %s is absent: %s\n' "$RELEASE_TAG" "$response" >&2
              exit 1
            fi
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: syncthing-*
          path: incoming
      - name: Sort desktop and Android artifacts
        run: |
          mkdir dist android-dist
          mv incoming/syncthing-android-arm64 android-dist/
          mv incoming/syncthing-aarch64-apple-darwin incoming/syncthing-aarch64-unknown-linux-musl incoming/syncthing-x86_64-unknown-linux-musl dist/
          rmdir incoming
      - name: Verify Linux ELF artifacts are fully static
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          command -v readelf >/dev/null
          X86_64_COUNT=0
          AARCH64_COUNT=0
          for binary in dist/**/*; do
            [[ -f "$binary" ]] || continue
            if ! readelf -h "$binary" >/dev/null 2>&1; then
              continue
            fi
            machine=$(readelf -h "$binary" | sed -n 's/^[[:space:]]*Machine:[[:space:]]*//p')
            case "$machine" in
              "Advanced Micro Devices X86-64") X86_64_COUNT=$((X86_64_COUNT + 1)) ;;
              AArch64) AARCH64_COUNT=$((AARCH64_COUNT + 1)) ;;
              *) printf '%s has unsupported ELF machine %s\n' "$binary" "$machine" >&2; exit 1 ;;
            esac
            program_headers=$(readelf -lW "$binary")
            if [[ "$program_headers" == *INTERP* ]]; then
              printf '%s has a dynamic ELF interpreter\n' "$binary" >&2
              exit 1
            fi
            dynamic_section=$(readelf -dW "$binary")
            if [[ "$dynamic_section" == *NEEDED* ]]; then
              printf '%s has a dynamic library dependency\n' "$binary" >&2
              exit 1
            fi
          done
          if [[ "$X86_64_COUNT" -ne 1 || "$AARCH64_COUNT" -ne 1 ]]; then
            printf 'Expected one x86_64 and one aarch64 Linux ELF artifact, found x86_64=%s aarch64=%s\n' "$X86_64_COUNT" "$AARCH64_COUNT" >&2
            exit 1
          fi
      - name: Validate and package release artifacts
        run: |
          expected_artifacts=$'syncthing-aarch64-apple-darwin\nsyncthing-aarch64-unknown-linux-musl\nsyncthing-x86_64-unknown-linux-musl'
          actual_artifacts=$(find dist -mindepth 1 -maxdepth 1 -print | sed 's|.*/||' | LC_ALL=C sort)
          if [[ "$actual_artifacts" != "$expected_artifacts" ]]; then
            echo "Unexpected release artifact directories:" >&2
            printf '%s\n' "$actual_artifacts" >&2
            exit 1
          fi
          for artifact in $expected_artifacts; do
            actual=$(find "dist/$artifact" -type f -print | sed 's|.*/||' | LC_ALL=C sort)
            if [[ "$actual" != "$artifact" ]]; then
              echo "Unexpected files in artifact $artifact:" >&2
              printf '%s\n' "$actual" >&2
              exit 1
            fi
          done
          actual_android=$(find android-dist -mindepth 1 -maxdepth 1 -print | sed 's|.*/||' | LC_ALL=C sort)
          if [[ "$actual_android" != "syncthing-android-arm64" ]]; then
            echo "Unexpected Android artifact directories:" >&2
            printf '%s\n' "$actual_android" >&2
            exit 1
          fi
          actual_android_file=$(find "android-dist/syncthing-android-arm64" -type f -print | sed 's|.*/||' | LC_ALL=C sort)
          if [[ "$actual_android_file" != "syncthing-android-arm64" ]]; then
            echo "Unexpected files in Android artifact:" >&2
            printf '%s\n' "$actual_android_file" >&2
            exit 1
          fi
          mkdir dist/zips
          for file in \
            dist/syncthing-aarch64-apple-darwin/syncthing-aarch64-apple-darwin \
            dist/syncthing-aarch64-unknown-linux-musl/syncthing-aarch64-unknown-linux-musl \
            dist/syncthing-x86_64-unknown-linux-musl/syncthing-x86_64-unknown-linux-musl \
            android-dist/syncthing-android-arm64/syncthing-android-arm64; do
            zip -9 --junk-paths "dist/zips/$(basename "$file").zip" "$file"
          done
          cd dist/zips
          sha256sum *.zip | LC_ALL=C sort -k2 > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Create release tag at triggering SHA
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: release-${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ needs.preflight.outputs.default_branch }}
        run: |
          default_branch=$(gh api "repos/$REPOSITORY" --jq '.default_branch')
          if [[ "$EVENT_NAME" != workflow_dispatch || "$REF" != "refs/heads/$default_branch" || "$DEFAULT_BRANCH" != "$default_branch" ]]; then
            echo "Release publication rejected: expected workflow_dispatch on refs/heads/$default_branch, got $EVENT_NAME on $REF" >&2
            exit 1
          fi
          if response=$(gh api "repos/$REPOSITORY/git/ref/tags/$RELEASE_TAG" 2>&1); then
            echo "Release publication rejected: tag $RELEASE_TAG already exists; inspect it before proceeding" >&2
            exit 1
          elif [[ "$response" != *"HTTP 404"* ]]; then
            printf 'Could not verify that tag %s is absent: %s\n' "$RELEASE_TAG" "$response" >&2
            exit 1
          fi
          if response=$(gh api "repos/$REPOSITORY/git/refs" -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$GITHUB_SHA" 2>&1); then
            echo "Created $RELEASE_TAG at $GITHUB_SHA"
          else
            printf 'Could not create release tag %s at %s: %s\n' "$RELEASE_TAG" "$GITHUB_SHA" "$response" >&2
            exit 1
          fi
      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: release-${{ github.sha }}
        run: gh release create "$RELEASE_TAG" dist/zips/*.zip dist/zips/SHA256SUMS --repo "$GITHUB_REPOSITORY" --prerelease --verify-tag --title "$RELEASE_TAG"
